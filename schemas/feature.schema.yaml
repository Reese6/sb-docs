# Схема feature-директории docs/features/<feature-name>/.
# Описывает состав файлов и их обязательность.
# Человекочитаемое описание структуры: docs/features/README.md
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Feature directory
type: object
required:
  - name
  - files
properties:
  name:
    # Имя директории feature, kebab-case
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  # Директории feature, у которых обязателен индекс README.md
  # и хотя бы один файл кроме него. Читает scripts/validate-docs.mjs.
  indexDirs:
    type: array
    default:
      - "api/"
      - "model/"
    items:
      type: string
  files:
    type: object
    required:
      - readme
      - product
      - requirements
    properties:
      readme:
        # README.md — обзор feature; обязателен
        const: "README.md"
      product:
        # product.md — WHAT + WHY; обязателен
        const: "product.md"
      requirements:
        # requirements.md — FR/BR/NFR; обязателен
        const: "requirements.md"
      model:
        # model/ — опциональна (feature без новых или изменённых сущностей);
        # внутри README.md — индекс и файл на каждую новую или изменяемую сущность
        const: "model/"
      ui:
        # ui.md — опционален (backend-only feature может не иметь UI)
        const: "ui.md"
      api:
        # api/ — опциональна (feature без внешнего API);
        # внутри README.md — индекс и файл на каждый метод
        const: "api/"
      technical:
        # technical.md — опционален до начала проработки реализации
        const: "technical.md"
      decisions:
        # decisions/ — директория ADR; создаётся при первом ADR
        const: "decisions/"
    additionalProperties: false
additionalProperties: false
